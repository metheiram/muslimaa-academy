{% extends 'messaging/base_messaging.html' %}

{% block msg_content %}
<div class="card">
    <div class="card-body">
        <form method="POST" class="compose-form">
            {% csrf_token %}
            <div class="form-group">
                <label>To *</label>
                <select name="recipient" required>
                    <option value="">Select Recipient</option>
                    {% for user in available_users %}
                    <option value="{{ user.id }}" {% if selected_recipient and selected_recipient.id == user.id %}selected{% endif %}>
                        {{ user.get_full_name|default:user.username }}
                        {% if user.is_superuser %}(Admin){% elif user.is_staff %}(Teacher){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Subject *</label>
                <input type="text" name="subject" required placeholder="Message subject...">
            </div>
            <div class="form-group">
                <label>Message *</label>
                <textarea name="body" required placeholder="Write your message..."></textarea>
            </div>
            <div style="display:flex; gap:0.75rem;">
                <button type="submit" class="btn btn-primary">Send Message</button>
                <a href="{% url 'messaging:inbox' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
