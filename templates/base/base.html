{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Muslimaa Academy | Learn, Grow & Lead{% endblock %}</title>
    <meta name="description" content="Muslimaa Academy empowers Muslim women and girls through meaningful learning, Quranic education, personal development, leadership and practical growth.">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/app.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'base/navbar.html' %}
    {% include 'base/messages.html' %}
    {% block content %}{% endblock %}
    {% include 'base/footer.html' %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
