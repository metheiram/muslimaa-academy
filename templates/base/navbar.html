{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- PREMIUM NAVBAR -->
<header class="site-header" role="banner">
    <div class="container nav-container">
        <!-- BRAND -->
        <a class="brand" href="{% url 'home' %}">
            <img src="{% static 'images/logo.jpg' %}" alt="Muslimaa Academy" class="brand-logo-image">
        </a>

        <!-- HAMBURGER MENU -->
        <button id="nav-toggle" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- NAVIGATION -->
        <nav id="site-nav" class="site-nav" role="navigation" aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                <li class="dropdown-wrapper">
                    <a href="{% url 'courses:course_list' %}" class="nav-link">Courses</a>
                </li>
                <li><a href="{% url 'content:about' %}" class="nav-link">About</a></li>
                <li><a href="{% url 'content:contact' %}" class="nav-link">Contact</a></li>
            </ul>

            <!-- NAV ACTIONS -->
            <div class="nav-actions">
                {% if user.is_authenticated %}
                    <div class="dropdown-wrapper user-menu">
                        <a href="{% url 'accounts:profile' %}" class="nav-link">
                            <span class="user-icon">👤</span>
                            <span>{{ user.get_short_name|default:user.username }}</span>
                            <span class="caret">▾</span>
                        </a>
                        <div class="dropdown-menu dropdown-user">
                            <a href="{% url 'accounts:profile' %}">My Profile</a>
                            <a href="{% url 'accounts:logout' %}">Logout</a>
                        </div>
                    </div>
                {% else %}
                    <a class="btn-nav-link" href="{% url 'accounts:login' %}">Login</a>
                    <a class="btn btn-nav-primary" href="{% url 'accounts:register' %}">Join Now</a>
                {% endif %}
            </div>
        </nav>
    </div>

    <!-- STICKY INDICATOR -->
    <div class="navbar-scroll-indicator"></div>
</header>

<style>
    /* ========================================
       NAVBAR VARIABLES
       ======================================== */
    .site-header {
        --nav-bg: #ffffff;
        --nav-text: #2d0d0f;
        --nav-hover: rgba(71, 24, 32, 0.08);
        --nav-accent: #d4a574;
        --nav-border: rgba(71, 24, 32, 0.08);
        --nav-shadow: 0 2px 12px rgba(71, 24, 32, 0.06);
    }

    .site-header.scrolled {
        --nav-shadow: 0 8px 32px rgba(71, 24, 32, 0.12);
    }

    /* ========================================
       HEADER STRUCTURE
       ======================================== */
    .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
        box-shadow: var(--nav-shadow);
        transition: box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding: 1rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* ========================================
       BRAND
       ======================================== */
    .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 50px;
        gap: 0.6rem;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #471820;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        flex-shrink: 0;
    }

    .brand-logo-image {
        height: 50px;
        width: auto;
        object-fit: contain;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        filter: drop-shadow(0 2px 4px rgba(71, 24, 32, 0.1));
    }

    .brand:hover .brand-logo-image {
        transform: scale(1.08);
        filter: drop-shadow(0 4px 12px rgba(212, 165, 116, 0.3));
    }

    .brand:hover {
        color: #d4a574;
    }

    /* ========================================
       NAVIGATION LINKS
       ======================================== */
    .site-nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex: 1;
    }

    .nav-links {
        display: flex;
        list-style: none;
        gap: 0.5rem;
        align-items: center;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.7rem 1.2rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--nav-text);
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
    }

    .nav-link::after {
        content: '';
        position: absolute;
        bottom: 4px;
        left: 1.2rem;
        right: 1.2rem;
        height: 2px;
        background: #d4a574;
        border-radius: 1px;
        transform: scaleX(0);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-link:hover {
        background: var(--nav-hover);
        color: #471820;
    }

    .nav-link:hover::after {
        transform: scaleX(1);
    }

    .caret {
        font-size: 0.65rem;
        opacity: 0.7;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ========================================
       DROPDOWN MENUS
       ======================================== */
    .dropdown-wrapper {
        position: relative;
    }

    .dropdown-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        left: 0;
        background: var(--nav-bg);
        border: 1px solid var(--nav-border);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(71, 24, 32, 0.12);
        min-width: 200px;
        padding: 0.75rem 0;
        display: none;
        flex-direction: column;
        z-index: 2000;
        animation: slideDown 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .dropdown-wrapper:hover .dropdown-menu {
        display: flex;
    }

    .dropdown-menu a {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--nav-text);
        text-decoration: none;
        transition: all 0.2s ease;
        border-left: 3px solid transparent;
    }

    .dropdown-menu a:hover {
        background: var(--nav-hover);
        border-left-color: #d4a574;
        padding-left: 1.5rem;
    }

    /* ========================================
       NAV ACTIONS (Buttons)
       ======================================== */
    .nav-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-left: auto;
    }

    .btn-nav-link {
        padding: 0.7rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #471820;
        text-decoration: none;
        border-radius: 50px;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        border: 2px solid transparent;
    }

    .btn-nav-link:hover {
        border-color: #471820;
    }

    .btn-nav-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.8rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: #ffffff;
        background: #471820;
        text-decoration: none;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 4px 15px rgba(71, 24, 32, 0.25);
    }

    .btn-nav-primary:hover {
        background: #3d1319;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(71, 24, 32, 0.35);
    }

    /* ========================================
       USER MENU
       ======================================== */
    .user-menu .nav-link {
        background: rgba(71, 24, 32, 0.05);
        padding: 0.7rem 1.2rem;
    }

    .user-menu .nav-link .user-icon {
        font-size: 1.1rem;
    }

    .dropdown-user {
        min-width: 180px;
    }

    .dropdown-user a {
        padding: 0.85rem 1.25rem;
    }

    /* ========================================
       HAMBURGER MENU
       ======================================== */
    .nav-toggle {
        display: none;
        flex-direction: column;
        gap: 0.35rem;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        z-index: 2001;
    }

    .hamburger-line {
        width: 24px;
        height: 2.5px;
        background: #471820;
        border-radius: 2px;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(8px, 8px);
    }

    .nav-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
        opacity: 0;
    }

    .nav-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(7px, -7px);
    }

    /* ========================================
       SCROLL INDICATOR
       ======================================== */
    .navbar-scroll-indicator {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #d4a574, transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .site-header.scrolled .navbar-scroll-indicator {
        opacity: 1;
    }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 768px) {
        .nav-container {
            gap: 1rem;
            padding: 0.75rem 1rem;
        }

        .brand {
            height: 45px;
        }

        .brand-logo-image {
            height: 45px;
        }

        .site-nav {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--nav-bg);
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: 1.5rem 1.5rem 3rem;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            border-bottom: 1px solid var(--nav-border);
            box-shadow: var(--nav-shadow);
        }

        .site-nav[aria-expanded="true"] {
            transform: translateX(0);
        }

        .nav-toggle {
            display: flex;
        }

        .brand {
            font-size: 1.2rem;
        }

        .nav-links {
            flex-direction: column;
            gap: 0;
            width: 100%;
        }

        .nav-link {
            width: 100%;
            padding: 0.9rem 0.8rem;
            border-radius: 0;
        }

        .nav-link::after {
            display: none;
        }

        .nav-link:hover {
            border-left: 3px solid #d4a574;
            padding-left: 1.1rem;
        }

        .dropdown-wrapper {
            position: static;
        }

        .dropdown-menu {
            position: static;
            box-shadow: none;
            border: none;
            background: rgba(71, 24, 32, 0.04);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .dropdown-wrapper:hover .dropdown-menu {
            display: flex;
        }

        .dropdown-wrapper.mobile-active .dropdown-menu {
            max-height: 200px;
            border-top: 1px solid var(--nav-border);
        }

        .dropdown-menu a {
            padding: 0.8rem 1.6rem;
        }

        .nav-actions {
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            margin-left: 0;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--nav-border);
        }

        .btn-nav-link,
        .btn-nav-primary {
            width: 100%;
            text-align: center;
        }

        .user-menu {
            width: 100%;
        }

        .user-menu .nav-link {
            width: 100%;
        }

        .dropdown-user {
            min-width: auto;
        }
    }

    @media (max-width: 480px) {
        .nav-container {
            padding: 0.6rem 0.75rem;
        }

        .brand {
            height: 40px;
        }

        .brand-logo-image {
            height: 40px;
        }

        .site-nav {
            padding: 1rem 1rem 2rem;
        }

        .nav-link {
            font-size: 0.9rem;
            padding: 0.8rem 0.6rem;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const navToggle = document.getElementById('nav-toggle');
        const siteNav = document.getElementById('site-nav');
        const siteHeader = document.querySelector('.site-header');
        const navLinks = document.querySelectorAll('.nav-link');

        // Toggle mobile menu
        navToggle.addEventListener('click', function() {
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', !isExpanded);
            siteNav.setAttribute('aria-expanded', !isExpanded);
        });

        // Close menu when clicking nav links
        navLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                navToggle.setAttribute('aria-expanded', 'false');
                siteNav.setAttribute('aria-expanded', 'false');
            });
        });

        // Handle dropdowns on mobile
        const dropdownWrappers = document.querySelectorAll('.dropdown-wrapper');
        dropdownWrappers.forEach(function(wrapper) {
            wrapper.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    this.classList.toggle('mobile-active');
                }
            });
        });

        // Add scroll indicator
        window.addEventListener('scroll', function() {
            if (window.scrollY > 0) {
                siteHeader.classList.add('scrolled');
            } else {
                siteHeader.classList.remove('scrolled');
            }
        });
    });
</script>
